let currentWeek=1;
let state={};

function loadState(){try{const r=localStorage.getItem('treino_ciclo3');state=r?JSON.parse(r):{};}catch(e){state={};}}
function saveState(){try{localStorage.setItem('treino_ciclo3',JSON.stringify(state));}catch(e){}}
function getSetState(exId,si){if(!state[exId])state[exId]={sets:{}};if(!state[exId].sets[si])state[exId].sets[si]={kg:'',done:false};return state[exId].sets[si];}

function render(){renderTabs();renderDays();updateProgress();}

function renderTabs(){
  document.getElementById('weekTabs').innerHTML=Object.keys(WEEKS).map(wk=>{
    const w=WEEKS[wk];
    const cls=`week-tab ${parseInt(wk)===currentWeek?'active':''} ${w.type==='travel'?'travel':''} ${w.type==='deload'?'deload':''}`;
    return `<button class="${cls}" onclick="switchWeek(${wk})">${w.label}</button>`;
  }).join('');
}

function switchWeek(wk){currentWeek=parseInt(wk);renderTabs();renderDays();updateProgress();}

function renderDays(){
  document.getElementById('daysContainer').innerHTML=WEEKS[currentWeek].days.map(d=>renderDay(d)).join('');
}

function renderDay(day){
  const isTravel=day.tipo==='viag';
  const bc=day.tipo==='musc'?'badge-musc':day.tipo==='corr'?'badge-corr':day.tipo==='viag'?'badge-viag':'badge-desc';
  const bl=day.tipo==='musc'?'MUSCULACAO':day.tipo==='corr'?'CORRIDA':day.tipo==='viag'?'VIAGEM':'DESCANSO';
  const {total,done}=getDayProgress(day);
  const pct=total>0?Math.round((done/total)*100):0;
  const C=2*Math.PI*12,offset=C-(pct/100)*C;
  const isComplete=total>0&&done===total;
  const ring=total>0?`<div class="day-progress-ring"><svg width="32" height="32" viewBox="0 0 32 32"><circle class="ring-bg" cx="16" cy="16" r="12"/><circle class="ring-fill" cx="16" cy="16" r="12" stroke-dasharray="${C}" stroke-dashoffset="${offset}" stroke="${isComplete?'var(--success)':'var(--accent)'}"/></svg><div class="ring-text">${pct}%</div></div>`:`<div style="width:32px"></div>`;
  let body='';
  if(day.tipo==='musc'&&day.exercicios) body=`<div class="ex-list">${day.exercicios.map(ex=>renderEx(ex)).join('')}</div>`;
  else if((day.tipo==='corr'||day.tipo==='viag')&&day.run) body=`<div class="run-block">${day.run.map(r=>`<div class="run-row"><span class="run-label">${r.label}</span><span class="run-val ${isTravel?'travel':''}">${r.val}</span></div>`).join('')}</div>`;
  else body=`<div class="rest-block">✦ Descanso — sem treino estruturado</div>`;
  if(day.nota) body+=`<div class="nota-block ${isTravel?'travel':''}"><div class="nota-label">NOTA</div>${day.nota}</div>`;
  return `<div class="day-card ${isComplete?'completed':''}" id="card_${day.id}"><div class="day-header" onclick="toggleDay('${day.id}')"><span class="day-badge ${bc}">${bl}</span><div class="day-info"><div class="day-name">${day.name} — ${day.titulo}</div><div class="day-meta">${day.meta}</div></div>${ring}<span class="chevron" id="chev_${day.id}">▾</span></div><div class="day-body" id="body_${day.id}">${body}</div></div>`;
}

function renderEx(ex){
  const allDone=Array.from({length:ex.series},(_,si)=>getSetState(ex.id,si).done).every(Boolean);
  let sets=`<div class="sets-header"><span style="text-align:center">SET</span><span style="text-align:center">KG</span><span style="text-align:center">REPS</span><span></span></div>`;
  for(let si=0;si<ex.series;si++){
    const ss=getSetState(ex.id,si);
    sets+=`<div class="set-row" id="setrow_${ex.id}_${si}"><span class="set-num">${si+1}</span><input class="set-input ${ss.kg?'filled':''}" type="number" inputmode="decimal" placeholder="—" value="${ss.kg}" onchange="setKg('${ex.id}',${si},this.value)" onfocus="this.select()"/><div style="font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;padding:7px 4px">${ex.reps}</div><button class="set-done-btn ${ss.done?'done':''}" onclick="toggleSetDone('${ex.id}',${si})"><svg viewBox="0 0 12 10"><polyline points="1,5 4,8 11,1"/></svg></button></div>`;
  }
  if(ex.obs) sets+=`<div class="ex-obs">${ex.obs}</div>`;
  return `<div class="ex-item ${allDone?'ex-done':''}" id="exitem_${ex.id}"><div class="ex-top" onclick="toggleEx('${ex.id}')"><div class="ex-check ${allDone?'checked':''}" id="excheck_${ex.id}" onclick="event.stopPropagation();toggleExDone('${ex.id}',${ex.series})"><svg viewBox="0 0 12 10"><polyline points="1,5 4,8 11,1"/></svg></div><div class="ex-info"><div class="ex-name">${ex.nome}</div><div class="ex-specs">${ex.series}x${ex.reps}</div></div><span class="ex-expand" id="exexp_${ex.id}">▾</span></div><div class="ex-sets" id="exsets_${ex.id}">${sets}</div></div>`;
}

function toggleDay(id){const b=document.getElementById('body_'+id),c=document.getElementById('chev_'+id);const o=b.classList.toggle('open');if(c)c.classList.toggle('open',o);}
function toggleEx(id){const s=document.getElementById('exsets_'+id),e=document.getElementById('exexp_'+id);const o=s.classList.toggle('open');if(e)e.classList.toggle('open',o);}
function setKg(exId,si,val){getSetState(exId,si).kg=val;const inp=document.querySelector(`#setrow_${exId}_${si} .set-input`);if(inp)inp.classList.toggle('filled',!!val);saveState();}
function toggleSetDone(exId,si){const ss=getSetState(exId,si);ss.done=!ss.done;const btn=document.querySelector(`#setrow_${exId}_${si} .set-done-btn`);if(btn)btn.classList.toggle('done',ss.done);refreshExDone(exId);updateProgress();saveState();}
function toggleExDone(exId,n){const rows=document.querySelectorAll(`[id^="setrow_${exId}_"]`);const allDone=Array.from(rows).every(r=>r.querySelector('.set-done-btn.done'));const nd=!allDone;for(let si=0;si<n;si++){getSetState(exId,si).done=nd;const btn=document.querySelector(`#setrow_${exId}_${si} .set-done-btn`);if(btn)btn.classList.toggle('done',nd);}refreshExDone(exId);updateProgress();saveState();}
function refreshExDone(exId){const rows=document.querySelectorAll(`[id^="setrow_${exId}_"]`);const allDone=rows.length>0&&Array.from(rows).every(r=>r.querySelector('.set-done-btn.done'));const ck=document.getElementById('excheck_'+exId),it=document.getElementById('exitem_'+exId);if(ck)ck.classList.toggle('checked',allDone);if(it)it.classList.toggle('ex-done',allDone);const wk=WEEKS[currentWeek];for(const day of wk.days){if(!day.exercicios)continue;if(day.exercicios.some(ex=>ex.id===exId)){updateDayRing(day);break;}}}
function updateDayRing(day){const{total,done}=getDayProgress(day);const pct=total>0?Math.round((done/total)*100):0;const C=2*Math.PI*12,offset=C-(pct/100)*C;const isComplete=total>0&&done===total;const ring=document.querySelector(`#card_${day.id} .ring-fill`);const text=document.querySelector(`#card_${day.id} .ring-text`);const card=document.getElementById('card_'+day.id);if(ring){ring.style.strokeDashoffset=offset;ring.style.stroke=isComplete?'var(--success)':'var(--accent)';}if(text)text.textContent=pct+'%';if(card)card.classList.toggle('completed',isComplete);}
function getDayProgress(day){if(!day.exercicios)return{total:0,done:0};let t=0,d=0;for(const ex of day.exercicios)for(let si=0;si<ex.series;si++){t++;if(getSetState(ex.id,si).done)d++;}return{total:t,done:d};}
function updateProgress(){const wk=WEEKS[currentWeek];let t=0,d=0;for(const day of wk.days){const p=getDayProgress(day);t+=p.total;d+=p.done;}const pct=t>0?Math.round((d/t)*100):0;document.getElementById('progressInfo').textContent=`${d} / ${t} sets`;document.getElementById('progressBar').style.width=pct+'%';}
function saveAll(){saveState();showToast('salvo ✓');}
function confirmReset(){if(confirm('Resetar checagens desta semana? Os pesos salvos serao mantidos.')){const wk=WEEKS[currentWeek];for(const day of wk.days){if(!day.exercicios)continue;for(const ex of day.exercicios)for(let si=0;si<ex.series;si++)getSetState(ex.id,si).done=false;}saveState();renderDays();updateProgress();showToast('semana resetada ✓');}}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

loadState();render();
</script>
